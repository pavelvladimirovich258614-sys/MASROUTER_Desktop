appId: local.masrouter.desktop
productName: MASROUTER Desktop
copyright: Copyright (c) 2026 MASROUTER Team
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - package.json
  - electron.cjs
  - shared/**/*
asar: true
extraResources:
  - from: assets
    to: assets
    filter: ['**/*']
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: icon.ico
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: icon.png
  category: public.app-category.developer-tools
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: icon.png
  category: Development
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MASROUTER Desktop
portable:
  artifactName: MASROUTER Desktop ${version} portable.${ext}
